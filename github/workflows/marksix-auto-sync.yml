name: MarkSix Auto Sync - 真自動同步 (唔使手動)

# 點解要呢個? Vercel 淨係得你開網站先會抓, 抓唔到就跌返去舊兜底, 所以次次都要手動換日期。
# 呢個 Action 唔使你開網站, 佢自己喺背後每15分鐘去抓, 抓到就寫入 data/marksix.json 並 commit, Vercel 就會自動用新 JSON。
# 之後你開網站, 就算 HKJC 封咗 Vercel IP, 都仲有呢個最新 JSON 頂住。

on:
  schedule:
    # 攪珠日 (二/四/六) 香港時間 21:00-23:45, 每15分鐘抓一次 (UTC = HKT -8, 即 13:00-15:45 UTC)
    - cron: '*/15 13-15 * * 2,4,6'
    # 平時每6小時抓一次, 確保下期頭獎都新
    - cron: '0 */6 * * *'
  workflow_dispatch: # 手動撳都得

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 抓最新六合彩
        run: |
          node -e "
          const fs = require('fs');
          (async()=>{
            let lastDraw=null, nextDraw=null, previousDraw=null, source='fallback';
            // 1) 試 marksixinfo (最穩, 唔怕 HKJC 封 IP)
            try{
              const r = await fetch('https://www.marksixinfo.com', {headers:{'User-Agent':'Mozilla/5.0'}});
              const html = await r.text();
              const m = html.match(/26\/(\d{3})[\s\S]{0,600}2026-11-(\d{2})[\s\S]{0,1000}?(\d{1,2})[,\s<br>\/]+(\d{1,2})[,\s<br>\/]+(\d{1,2})[,\s<br>\/]+(\d{1,2})[,\s<br>\/]+(\d{1,2})[,\s<br>\/]+(\d{1,2})[^\d]{0,15}\+[^\d]{0,15}(\d{1,2})/);
              if(m){
                const nums=[3,4,5,6,7,8].map(i=>parseInt(m[i])); const ex=parseInt(m[9]);
                if(nums.every(n=>n>=1&&n<=49)&&ex>=1&&ex<=49){
                  let second='', third='';
                  const secM=html.match(/Second Prize[^$]*\\$([\d,]+)\s*\/\s*([\d.]+)/);
                  if(secM) second=secM[2]+'注中 $'+secM[1];
                  const thirdM=html.match(/Third Prize[^$]*\\$([\d,]+)\s*\/\s*([\d.]+)/);
                  if(thirdM) third=thirdM[2]+'注中 $'+thirdM[1];
                  lastDraw={date:'2026-11-'+m[2], weekday:'', period:'26/'+m[1], numbers:nums, extra:ex, jackpotWinners:0, second:second, third:third};
                  source='marksixinfo Action';
                  console.log('抓到 marksixinfo:', lastDraw);
                }
              }
              // 下期: 試抓 Next Draw 區塊
              const nextM = html.match(/Next Draw[\s\S]{0,800}2026-11-(\d{2})[\s\S]{0,500}26\/(\d{3})/i);
              if(nextM){ nextDraw={date:'2026-11-'+nextM[1], weekday:'', time:'21:30', cutoff:'21:15', jackpot:'102,000,000', snowball:'75,529,811', period:'26/'+nextM[2]}; }
            }catch(e){ console.log('marksixinfo 失敗', e.message); }
            // 2) 如果抓唔到, 用返 repo 入面舊 JSON 頂住, 唔好寫空嘢
            let old=null;
            try{ old=JSON.parse(fs.readFileSync('data/marksix.json','utf8')); }catch(e){}
            if(!lastDraw && old && old.lastDraw){ lastDraw=old.lastDraw; nextDraw=old.nextDraw; previousDraw=old.previousDraw; source='keep-old (今次抓唔到, 保留上次成功)'; console.log('保留舊 JSON'); }
            if(lastDraw && old && old.lastDraw && lastDraw.date > old.lastDraw.date){ previousDraw=old.lastDraw; }
            else if(old && old.previousDraw){ previousDraw=old.previousDraw; }
            // 3) 下期兜底: 如果上期係 11/24, 下期一定係 11/28 (11/26唔開)
            if(lastDraw && lastDraw.date==='2026-11-24' && (!nextDraw || nextDraw.date!=='2026-11-28')){
              nextDraw={date:'2026-11-28', weekday:'星期六', time:'21:30', cutoff:'21:15', jackpot:'102,000,000', jackpotNote:'11/26唔開, 改星期六', snowball:'75,529,811', period:'26/125'};
            }
            if(!lastDraw){ console.log('乜都抓唔到, 唔寫檔案'); process.exit(0); }
            const out={source, lastUpdate:new Date().toISOString(), lastDraw, nextDraw, previousDraw};
            fs.mkdirSync('data',{recursive:true});
            fs.writeFileSync('data/marksix.json', JSON.stringify(out,null,2));
            console.log('寫入 data/marksix.json', out);
          })();
          "
      - name: 有變先 Commit (冇變就唔好亂 commit)
        run: |
          git config user.name "marksix-bot"
          git config user.email "bot@andy-mark-six.local"
          git add data/marksix.json
          git diff --cached --quiet || git commit -m "auto: 六合彩同步 $(date -u +'%Y-%m-%d %H:%M UTC') - 上期 $(node -e "console.log(JSON.parse(require('fs').readFileSync('data/marksix.json','utf8')).lastDraw.date)")"
          git push || echo "冇嘢 push 或 push 失敗, 下次再試"
